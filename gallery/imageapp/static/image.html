<!DOCTYPE html>
<html>
<head>
    <title>Simple Image Gallery</title>

    <style>

        body{
    background:linear-gradient(to right, #fc466b, #3f5efb);
    text-align:center;
    font-family:Arial;
    height:100vh;
}

        h1{
            background:rgba(0,0,0,0.3);
            color:white;
            padding:15px;
        }

        .gallery{
            margin-top:40px;
        }

        img{
            width:400px;
            height:250px;
            border-radius:10px;
            box-shadow:0px 4px 10px black;
        }

        button{
            padding:10px 20px;
            margin:15px;
            background:darkblue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:black;
        }

    </style>
</head>

<body>

    <h1>MY IMAGE GALLERY</h1>

    <div class="gallery">

        <img id="image" src="rohit.jpeg">

        <br>

        <button onclick="previous()">Previous</button>

        <button onclick="next()">Next</button>

    </div>

    <script>

        // 7 Images

        let images = [

            "rohit.jpeg",
            "rohit 2.jpeg",
            "rohit 3.jpeg",
            "rohit 4.jpeg",
            "rohit 5.jpeg",
            "rohit 6.jpeg",
            "rohit 7.jpeg"

        ];

        let i = 0;

        function next(){

            i++;

            if(i == images.length){
                i = 0;
            }

            document.getElementById("image").src = images[i];
        }

        function previous(){

            i--;

            if(i < 0){
                i = images.length - 1;
            }

            document.getElementById("image").src = images[i];
        }

    </script>

</body>
</html>
